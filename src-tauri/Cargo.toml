[package]
name = "controlled-questionnaire-client"
version = "0.7.1"
description = "Client controllato per questionari online"
authors = ["Franco Arcieri"]
edition = "2021"

[lib]
name = "controlled_questionnaire_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
thiserror = "2"

rusqlite = { version = "0.32", features = ["bundled"] }
